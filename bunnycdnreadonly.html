  function formatRows(result) {
    const cols = result.cols.map(col => col.name);
    return result.rows.map(row => {
      const obj = {};
      row.forEach((cell, i) => {
        obj[cols[i]] = cell.value;
      });
      return obj;
    });
  }

  async function queryBunnyDB(sql, args = [], token = READ_ONLY_TOKEN) {
    const res = await fetch(DB_URL, {
      method: "POST",
      headers: {
        "Authorization": `Bearer ${token}`,
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        requests: [{ type: "execute", stmt: { sql, args } }, { type: "close" }],
      }),
    });
    return res.json();
  }

  const data = await queryBunnyDB("SELECT * FROM users");
  const firstResult = data.results[0];

  if (firstResult.type === "error") {
    console.error("SQL Error:", firstResult.error.message);
  } else {
    const users = formatRows(firstResult.response.result);
