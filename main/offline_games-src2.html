        async function generatePassword(num1, num2, chars) {
            num1 = String(num1);
            num2 = String(num2);

            if (!/^\d+$/.test(num1) ||
                !/^\d+$/.test(num2) ||
                !/^[a-zA-Z0-9]{8}$/.test(chars)) {
                throw new Error("Invalid inputs");
            }

            // Combine inputs
            const original = JSON.stringify([num1, num2, chars]);

            // Convert to character codes
            let data = Array.from(original, c => c.charCodeAt(0));

            // Position-based transformation
            data = data.map((c, i) =>
                (c + (i * 17 + 43)) % 65536
            );

            // Reverse alternating sections
            for (let i = 0; i < data.length; i += 8) {
                const section = data.slice(i, i + 8).reverse();
                data.splice(i, 8, ...section);
            }

            // Deterministic shuffle
            const order = data.map((_, i) => i);
            let seed = 92821;

            function random() {
                seed = (seed * 16807) % 2147483647;
                return seed;
            }

            for (let i = order.length - 1; i > 0; i--) {
                const j = random() % (i + 1);
                [order[i], order[j]] = [order[j], order[i]];
            }

            const scrambled = order.map(i => data[i]);

            // Convert to bytes consistently
            const bytes = new Uint8Array(scrambled.length * 2);

            scrambled.forEach((value, i) => {
                bytes[i * 2] = value & 255;
                bytes[i * 2 + 1] = value >> 8;
            });

            // SHA-256
            const hash = await crypto.subtle.digest("SHA-256", bytes);

            return Array.from(new Uint8Array(hash))
                .map(b => b.toString(16).padStart(2, "0"))
                .join("");
        }

        function base32Decode(base32) {
            const cleanInput = base32.replace(/=+$/, '').toUpperCase();
            let bits = 0;
            let value = 0;
            const bytes = [];

            for (let i = 0; i < cleanInput.length; i++) {
                const idx = BASE32ALTHABET.indexOf(cleanInput[i]);
                if (idx === -1) {
                throw new Error(`Invalid Base32 character: ${cleanInput[i]}`);
                }

                value = (value << 5) | idx;
                bits += 5;

                if (bits >= 8) {
                bytes.push((value >>> (bits - 8)) & 255);
                bits -= 8;
                }
            }

            return new TextDecoder().decode(new Uint8Array(bytes));
        }

    <script>

        const games = [
        "brotato-new",
        "idle-dice",
        "n-gon",
        "clover-pit",
        "balatro-port",
        "undertale",
        "celeste",
        "idle-research",
        "deltarune",
        "Minecraft 26.2 Version"
];

        const FileUrl = [
            "brotato-new.html",
            "idle-dice.html",
            "n-gon/index.html",
            "clover-pit.html",
            "balatro-port/index.html",
            "undertale/index.html",
            "celeste/index.html",
            "idle-research/index.html",
            "deltarune-main/deltarune-main/index.html",
            "eg.html"
        ]

        const gameList = document.getElementById("GameList");

        games.forEach(function(gameFile, index) {

            // Create a button
            const button = document.createElement("button");
            button.className = "OfflineGameButton";
            // Turn the filename into the button's name
            let gameName = gameFile;

            // Remove .html
            gameName = gameName.replace(/\.html$/i, "");

            // Replace - and _ with spaces
            gameName = gameName.replace(/[-_]/g, " ");

            // Capitalize the first letter of each word
            gameName = gameName.replace(/\b\w/g, function(letter) {
                return letter.toUpperCase();
            });

            // Set the button text

            let p_tag = document.createElement("p")
            p_tag.textContent = gameName
            p_tag.className= "OfflineGameButton-text"

            button.appendChild(p_tag)


            // When the button is clicked,
            // open the game from the offline folder
            button.onclick = async function() {
                if (gameFile.toLowerCase() === "n-gon") {
                    window.location.href = "https://puffcodewebsite.b-cdn.net/other_offline-html/n-gon/index.html";
                    return;
                }

                window.location.href = "../other_offline-html/" + FileUrl[index]
                
            };

            // Add the button to the page
            gameList.appendChild(button);

            // Put a space after each button
            gameList.appendChild(document.createTextNode(" "));
        });

            window.location.href = "game_stash.html";
        }

    <script type="module">
        async function loadExternalScript(filePath, functionName, ...parameters) {
            try {
            // 1. Import directly using the single path string
            const module = await import(filePath);
            
            // 2. Execute the function
            if (typeof module[functionName] === 'function') {
                module[functionName](...parameters);
            } else {
                console.error(`Function "${functionName}" not found in module.`);
            }
            } catch (err) {
            console.error('Failed to load or execute:', err);
            }
        }

        // Example Usage:
        // Just pass the relative path and the function name
